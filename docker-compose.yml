services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: accountsdb
      POSTGRES_USER: accounts
      POSTGRES_PASSWORD: accounts
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounts -d accountsdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/accountsdb
      SPRING_DATASOURCE_USERNAME: accounts
      SPRING_DATASOURCE_PASSWORD: accounts
    ports:
      - "8080:8080"